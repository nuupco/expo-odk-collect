name: Verify Build
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Agregado para que instale más rápido
      - run: npm install
      - run: npm test   # <--- ¡ESTO ES LO MÁS IMPORTANTE!
      - run: npm run build